services:
  hub:
    build:
      context: .
      args:
        BARISTA_VERSION: ${BARISTA_VERSION:-dev}
    ports:
      - "8787:8787"
      - "${PREVIEW_PORT:-8788}:${PREVIEW_PORT:-8788}"
    environment:
      COFFEE_SHOP_TOKEN: ${COFFEE_SHOP_TOKEN:?set COFFEE_SHOP_TOKEN}
      COFFEE_SHOP_PUBLIC_ORIGIN: ${COFFEE_SHOP_PUBLIC_ORIGIN:-http://hub.localhost:8787}
      PREVIEW_PUBLIC_ORIGIN: ${PREVIEW_PUBLIC_ORIGIN:-http://preview.localhost:8788}
      PREVIEW_BIND_HOST: 0.0.0.0
      PREVIEW_PORT: ${PREVIEW_PORT:-8788}
      PREVIEW_SIGNING_KEYS: ${PREVIEW_SIGNING_KEYS:?set PREVIEW_SIGNING_KEYS from openssl rand -hex 32}
      PREVIEW_ACTIVE_SIGNING_KEY_ID: ${PREVIEW_ACTIVE_SIGNING_KEY_ID:-current}
      PREVIEW_ACCESS_DEFAULT_TTL_SECONDS: ${PREVIEW_ACCESS_DEFAULT_TTL_SECONDS:-900}
      PREVIEW_ACCESS_MAX_TTL_SECONDS: ${PREVIEW_ACCESS_MAX_TTL_SECONDS:-3600}
    volumes:
      - coffee-shop-data:/data
    restart: unless-stopped

volumes:
  coffee-shop-data:
