version: "3"

dotenv: [".env"]

vars:
  COFFEE_SHOP_VERSION: 0.1.0
  BARISTA_VERSION:
    sh: echo "{{.COFFEE_SHOP_VERSION}}+$(git describe --tags --always --dirty)"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install JavaScript workspace dependencies
    cmds:
      - pnpm install

  dev:
    desc: Run the Coffee Shop control plane and frontend
    deps: [protocol:build]
    cmds:
      - task --parallel control-plane:dev frontend:dev

  dev:full:
    desc: Run the control plane, frontend, and a local Barista
    deps: [protocol:build]
    cmds:
      - task --parallel control-plane:dev frontend:dev control-agent:run

  build:
    desc: Build every product in the repository
    cmds:
      - task: protocol:build
      - task: control-plane:build
      - task: orchestrator-bridge:build
      - task: frontend:build
      - task: control-agent:build

  container:build:
    desc: Build the hub image with exact Barista release provenance
    cmds:
      - docker build --build-arg BARISTA_VERSION="{{.BARISTA_VERSION}}" -t coffee-shop:local .

  test:
    desc: Run every test suite
    cmds:
      - pnpm -r test
      - task: web:snapshot-fixtures:check
      - task: control-agent:test
      - task: capability-pack:test
      - task: system:test

  system:test:
    desc: Run the deterministic multi-node end-to-end system test (real hub and Barista processes, fake harnesses)
    deps: [protocol:build]
    dir: apps/control-agent
    cmds:
      - go test -tags system -count=1 -timeout 10m ./internal/systemtest/...

  system:test:instances:
    desc: Run the focused real-Hub/latest-Barista ephemeral-instance lifecycle proof
    deps: [protocol:build]
    dir: apps/control-agent
    cmds:
      - go test -tags system -count=1 -timeout 5m -run '^Test(Instance|EphemeralInstance|LegacyInstanceMigration|InvalidCurrentInstanceStateFailsBeforeListen$)' ./internal/systemtest/...

  system:test:preview:
    desc: Run the focused real-process isolated preview publication, delivery, and recovery proof
    deps: [protocol:build]
    dir: apps/control-agent
    cmds:
      - go test -tags system -count=1 -timeout 5m -run '^TestPreviewPublicationEndToEnd$' ./internal/systemtest/...

  system:test:capability-pack:
    desc: Run the closed installed-pack workflow, readiness, compatibility, cleanup, and upgrade proof
    deps: [protocol:build]
    dir: apps/control-agent
    cmds:
      - go test -tags system -count=1 -timeout 10m -run '^TestCapabilityPack(NativeEvaluationMatrix|UnsupportedACPParity|EvidenceFreshnessAndConflict|ReadinessGatesInstanceWork|RunIsolationAndCleanup|CrashRecovery|UpgradeRestartAndRollback)$' ./internal/systemtest/...

  capability-pack:build:
    desc: Build the deterministic Coffee Shop capability pack archive
    dir: apps/control-agent
    cmds:
      - go run ./cmd/capabilitypack build --pack ../../capability-pack --out ../../dist/capability-pack/coffeeshop-capability-pack.tar.gz

  capability-pack:seal:
    desc: Regenerate the capability pack's derived files and per-file digests in place
    dir: apps/control-agent
    cmds:
      - go run ./cmd/capabilitypack seal --pack ../../capability-pack

  capability-pack:test:
    desc: Validate the capability pack and run its packaging, screening, and evaluation tests
    dir: apps/control-agent
    cmds:
      - go run ./cmd/capabilitypack seal --pack ../../capability-pack --check
      - go run ./cmd/capabilitypack validate --pack ../../capability-pack
      - go test -count=1 ./internal/capabilitypack/...

  typecheck:
    desc: Type-check every TypeScript workspace
    cmds:
      - pnpm -r typecheck

  lint:
    desc: Run static checks across languages
    cmds:
      - task: control-agent:lint
      - git diff --check

  fmt:
    desc: Format Go source files
    cmds:
      - task: control-agent:fmt

  fmt:check:
    desc: Verify Go source formatting
    cmds:
      - task: control-agent:fmt:check

  ci:
    desc: Run the local CI pipeline
    cmds:
      - task: fmt:check
      - task: test
      - task: typecheck
      - task: lint
      - task: build

  protocol:build:
    desc: Build shared TypeScript contracts
    sources:
      - packages/protocol/src/**/*.ts
      - packages/protocol/tsconfig.json
    generates:
      - packages/protocol/dist/**/*.js
    cmds:
      - pnpm --filter @coffee-shop/protocol build

  frontend:dev:
    desc: Run the Vite frontend with reload
    deps: [protocol:build]
    cmds:
      - pnpm --filter @coffee-shop/web dev

  frontend:build:
    desc: Build the production frontend
    deps: [protocol:build]
    cmds:
      - VITE_BARISTA_VERSION={{.BARISTA_VERSION}} pnpm --filter @coffee-shop/web build

  frontend:test:
    desc: Run frontend tests
    cmds:
      - pnpm --filter @coffee-shop/web test

  web:snapshot-fixtures:check:
    desc: Regenerate the Hub-produced current/legacy PWA snapshots and reject stale committed bytes
    deps: [protocol:build]
    cmds:
      - pnpm --filter @coffee-shop/hub exec tsx ../../scripts/generate-web-snapshot-fixtures.mts
      - git diff --exit-code -- apps/web/src/test/fixtures/hubSnapshot.json apps/web/src/test/fixtures/legacyHubSnapshot.json

  frontend:typecheck:
    desc: Type-check the frontend
    cmds:
      - pnpm --filter @coffee-shop/web typecheck

  control-plane:dev:
    desc: Run the Coffee Shop hub with reload
    deps: [protocol:build]
    cmds:
      - pnpm --filter @coffee-shop/hub dev

  control-plane:build:
    desc: Build the Coffee Shop hub
    deps: [protocol:build]
    cmds:
      - pnpm --filter @coffee-shop/hub build

  control-plane:run:
    desc: Run the built Coffee Shop hub
    cmds:
      - pnpm --filter @coffee-shop/hub start

  control-plane:test:
    desc: Run control-plane tests
    cmds:
      - pnpm --filter @coffee-shop/hub test

  control-plane:typecheck:
    desc: Type-check the control plane
    cmds:
      - pnpm --filter @coffee-shop/hub typecheck

  orchestrator-bridge:build:
    desc: Build the Claude Code orchestrator bridge
    deps: [protocol:build]
    cmds:
      - pnpm --filter @coffee-shop/orchestrator-bridge build

  orchestrator-bridge:test:
    desc: Run orchestrator bridge tests
    cmds:
      - pnpm --filter @coffee-shop/orchestrator-bridge test

  orchestrator-bridge:typecheck:
    desc: Type-check the orchestrator bridge
    cmds:
      - pnpm --filter @coffee-shop/orchestrator-bridge typecheck

  control-agent:run:
    desc: Run Barista from source; append flags after --
    dir: apps/control-agent
    cmds:
      - go run ./cmd/barista {{.CLI_ARGS}}

  control-agent:build:
    desc: Build the portable Barista binary for this platform
    dir: apps/control-agent
    cmds:
      - mkdir -p ../../bin
      - go build -trimpath -ldflags "-s -w -X main.version={{.BARISTA_VERSION}}" -o ../../bin/barista ./cmd/barista

  control-agent:build:all:
    desc: Cross-compile Barista release binaries
    dir: apps/control-agent
    cmds:
      - mkdir -p ../../dist/barista
      - GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version={{.BARISTA_VERSION}}" -o ../../dist/barista/barista-linux-amd64 ./cmd/barista
      - GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version={{.BARISTA_VERSION}}" -o ../../dist/barista/barista-linux-arm64 ./cmd/barista
      - GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version={{.BARISTA_VERSION}}" -o ../../dist/barista/barista-darwin-amd64 ./cmd/barista
      - GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version={{.BARISTA_VERSION}}" -o ../../dist/barista/barista-darwin-arm64 ./cmd/barista
      - GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version={{.BARISTA_VERSION}}" -o ../../dist/barista/barista-windows-amd64.exe ./cmd/barista

  control-agent:test:
    desc: Run Barista tests
    dir: apps/control-agent
    cmds:
      - go test ./...

  control-agent:lint:
    desc: Vet Barista packages
    dir: apps/control-agent
    cmds:
      - go vet ./...
      - go vet -tags system ./internal/systemtest/...

  control-agent:fmt:
    desc: Format Barista source files
    dir: apps/control-agent
    cmds:
      - gofmt -w .

  control-agent:fmt:check:
    desc: Verify Barista source formatting
    dir: apps/control-agent
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted"
          exit 1
        fi
    silent: true
